name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate tag and manifest version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python3 -c 'import json; print(json.load(open("custom_components/greenflux/manifest.json"))["version"])')"

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a supported version tag."
            exit 1
          fi

          if [[ "$TAG" != "$MANIFEST_VERSION" ]]; then
            echo "Tag version $TAG does not match manifest version $MANIFEST_VERSION."
            exit 1
          fi

      - name: Build HACS ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd custom_components/greenflux
          zip -r "${GITHUB_WORKSPACE}/greenflux.zip" . \
            -x "*/__pycache__/*" "*.pyc" "*.pyo" ".DS_Store"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: greenflux
          path: greenflux.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" greenflux.zip \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
